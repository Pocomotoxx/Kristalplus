name: Kristal Colony Autonomous Agent Runner

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      task_title:
        description: 'Task Title for Colony'
        required: true
        default: 'Repository Architecture & Health Check'
      task_desc:
        description: 'Detailed Task Description'
        required: true
        default: 'Audit repository files, verify modularity, and suggest optimizations.'

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  run-colony:
    # Trigger on manually dispatched workflow or when an issue is labeled with 'colony' or starts with '/colony'
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'colony')) ||
      (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/colony'))
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚡ Setup Node.js & pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: 🟢 Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: 📦 Install Dependencies & Build Colony
        run: |
          cd packages/colony-core
          pnpm install
          pnpm run build

      - name: 🧠 Execute Kristal Colony Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          COLONY_TASK_TITLE: ${{ github.event.inputs.task_title || github.event.issue.title || 'GitHub Issue Task' }}
          COLONY_TASK_DESC: ${{ github.event.inputs.task_desc || github.event.issue.body || github.event.comment.body }}
        run: |
          node packages/colony-core/dist/github-runner.js

      - name: 💾 Commit & Push Colony Memory & Outputs
        run: |
          git config --global user.name "kristal-colony-bot[bot]"
          git config --global user.email "kristal-colony@users.noreply.github.com"
          git add .colony/
          git commit -m "chore(colony): update persistent vector memory and task outputs [skip ci]" || echo "No changes to commit"
          git push
