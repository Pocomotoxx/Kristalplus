name: chatgpt-federation

on:
  pull_request:
    paths:
      - 'plugins/colony-chatgpt-federation/**'
      # The suite guards against the gateway's channel tags drifting away from
      # this publisher's, so a gateway change must run it too.
      - 'plugins/colony-x-gateway/src/channels.mjs'
  push:
    branches: [main]
    paths:
      - 'plugins/colony-chatgpt-federation/**'
      - 'plugins/colony-x-gateway/src/channels.mjs'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/colony-chatgpt-federation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
